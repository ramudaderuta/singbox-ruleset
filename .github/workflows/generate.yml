name: generate

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["fetch-remote-json"]
    types: [completed]

permissions:
  contents: write

jobs:
  generatesrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup singbox
        env:
          SINGBOX_VERSION: "1.14.0-beta.13"
        run: |
          wget -O sing-box.deb "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box_${SINGBOX_VERSION}_linux_amd64.deb"
          sudo dpkg -i sing-box.deb
          sing-box version

      - name: install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: generate singbox config (recursively)
        run: |
          set -euo pipefail
          mkdir -p srs
          # 查找仓库中所有 json（排除 .git、srs、dat 目录），保留相对路径，并在 srs/ 下复刻目录结构
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            outdir="$(dirname "srs/$rel")"
            mkdir -p "$outdir"
            filename="$(basename "$rel" .json)"
            echo "Compiling $rel -> $outdir/$filename.srs"
            sing-box rule-set compile "$file" -o "$outdir/$filename.srs"
          done < <(find . -type f -name '*.json' ! -path "./.git/*" ! -path "./srs/*" ! -path "./dat/*" -print0)

      - name: generate dat files (recursively)
        run: |
          mkdir -p dat
          shopt -s nullglob
          # 同样递归遍历所有 json，并在 dat/ 下复刻目录结构
          find . -type f -name '*.json' ! -path "./.git/*" ! -path "./srs/*" ! -path "./dat/*" -print0 \
          | while IFS= read -r -d '' file; do
            rel="${file#./}"
            outdir="$(dirname "dat/$rel")"
            mkdir -p "$outdir"
            outfile="dat/${rel%.json}.dat"
            echo "Generating $outfile from $rel"
            jq -r '
              .rules[]? |
              ( .domain[]? | "full:" + . ),
              ( .domain_suffix[]? | "domain:" + . ),
              ( .domain_keyword[]? | "keyword:" + . ),
              ( .domain_regex[]? | "regexp:" + . ),
              ( .ip_cidr[]? )
            ' "$file" \
            | sed -E 's/^([^:]+):\.+(.*)/\1:\2/' \
            | sed "/^$/d" \
            | sort -u > "$outfile" || true
          done

      - name: Commit and push *.srs and *.dat
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add srs dat || true
          # 如果没有 staged 变更就退出
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "Generate srs and dat files"
            echo "commit message: Generate srs and dat files"
            git push
          fi
